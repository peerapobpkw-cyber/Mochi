<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>น้องเหมียว 🐱💗</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="sparkle">✨</div>
    <p class="eyebrow">MY LITTLE BUDDY</p>
    <h1>เจ้าเหมียวตัวนี้<br><span>น่ารักเกินไปแล้ว! 🐾</span></h1>

    <div class="photo-wrap">
      <div class="photo-glow"></div>
      <img src="cat.jpeg" alt="รูปน้องแมวนอนบนผ้าห่ม" class="cat-photo" />
      <div class="sticker sticker-1">💕</div>
      <div class="sticker sticker-2">🐾</div>
    </div>

    <p class="caption">“ขออ้อนหน่อยได้ไหม... 🥺”</p>

    <button id="loveButton" type="button">กดเพื่อส่งหัวใจ 💗</button>
    <p id="message" class="message">หัวใจถูกส่งให้น้องเหมียวแล้ว!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
